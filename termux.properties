### Host Termux app settings. Not read inside the Kali guest.
### Install: copy to ~/.termux/termux.properties on the Termux host, then
### run `termux-reload-settings`. Extra-keys changes need a new session.
### Spec: https://wiki.termux.com/wiki/Terminal_Settings

###############
# General
###############

### Stay off. External apps must not run commands in this terminal.
# allow-external-apps = true

default-working-directory = /data/data/com.termux/files/home

### Tablet: skip the session-change toast and keep the soft keyboard down
### until it is asked for. Toggle button enables/disables rather than flashes.
disable-terminal-session-change-toast = true
hide-soft-keyboard-on-startup = true
soft-keyboard-toggle-behaviour = enable/disable

### 4 GB RAM. Keep scrollback modest.
terminal-transcript-rows = 2000

### Volume keys stay volume. Extra keys are the on-screen row, not the rocker.
volume-keys = volume

###############
# Fullscreen mode
###############

fullscreen = true
use-fullscreen-workaround = true

###############
# Cursor
###############

terminal-cursor-blink-rate = 0
terminal-cursor-style = block

###############
# Extra keys
###############

### Two rows for a tablet with no hardware keyboard.
### Prefix is the tmux default, Ctrl-b. Swipe up for the popup.
extra-keys-style = arrows-all
extra-keys-text-all-caps = true
extra-keys = [ \
  [ \
    {key: ESC, popup: {macro: "CTRL b d", display: "detach"}}, \
    {key: TAB, popup: {macro: "CTRL b c", display: "new"}}, \
    {key: CTRL, popup: {macro: "CTRL b z", display: "zoom"}}, \
    {key: ALT, popup: {macro: "CTRL b w", display: "pick"}}, \
    {key: '-', popup: '|'}, \
    {key: '/', popup: '\\'}, \
    {key: UP, popup: PGUP}, \
    {key: KEYBOARD, popup: {macro: "CTRL d", display: "exit"}} \
  ], \
  [ \
    {key: HOME, popup: {macro: "CTRL a", display: "C-a"}}, \
    {key: LEFT, popup: {macro: "CTRL b LEFT", display: "pane"}}, \
    {key: DOWN, popup: PGDN}, \
    {key: RIGHT, popup: {macro: "CTRL b RIGHT", display: "pane"}}, \
    {key: END, popup: {macro: "CTRL e", display: "C-e"}}, \
    {key: ':', popup: ';'}, \
    {key: '~', popup: '`'} \
  ] \
]

###############
# Colors/themes
###############

use-black-ui = true

###############
# HW keyboard shortcuts
###############

### Volume-down is the Termux special key when no hardware keyboard is attached.
shortcut.create-session = ctrl + t
shortcut.next-session = ctrl + 2
shortcut.previous-session = ctrl + 1
shortcut.rename-session = ctrl + n

###############
# Bell key
###############

### No vibration on a tablet that sits on a desk.
bell-character = ignore

###############
# Back key
###############

### Android back sends Escape so shells and editors can leave insert mode.
back-key = escape

###############
# Keyboard issue workarounds
###############

### ctrl+space is used by emacs-mode zsh in the guest.
ctrl-space-workaround = true

###############
# Terminal Margin adjustments
###############

terminal-margin-horizontal = 3
terminal-margin-vertical = 0
